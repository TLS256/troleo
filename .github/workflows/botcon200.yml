name: nofake

on:
  workflow_dispatch:
    inputs:
      haxball_room_url:
        description: 'Link de la sala de Haxball'
        required: true
        default: 'https://www.haxball.com/play?c=wL71co1STPI'
      mensaje:
        description: 'Mensaje para el raid'
        required: true
        default: 'Raid por Teleese - 10k for this shitcode? Lol no worth '
      llamar_admin:
        description: 'Mensaje para llamar al administrador'
        required: true
        default: 'sexo'

jobs:
  run-bots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 27
      matrix:
        job_id: ["PainDeCola","MessiEnElAlma","fransitoXD","CapoDelFutbol","PITYBOSS","timitoxD","lagrimita","Neymarcito22","puerroxeneize2","ezequielito","FutbolMan","longueirax","cheguevarax","TODESPIBEX2","Barquito","casquitox","OptiPanax","GoleadorFurioso","Tristelito","CancheroX","PateadorLocox","DribblingKing","TiroLibrePro","BalonMagicoX","ArqueroFantasmaX","RayoVeloz22","CabezaDeGolX","ZonaDefensaProX","FintaMortal","ContraAtaqueX","RegateadorFeliz","RemateLetalX","PasePerfectoX","TikiTakaFanX","CabezazoFuerteX","DefensaTotalX","GolDePlacaX","BalonDeOroX","ArqueroLegendarioX","FutbolArteX","PatadaVoladoraX","MVPdelPartidoX","ControlTotalX","PaseLargoX","DefensaImplacableX","TiroCurvoX","BalonRotoX","GolazoIncreibleX","ArqueroSeguroX","RematePotenteX","RegateTotalX","DribbleProX","ZonaMediaX","PaseMagicoX","PorteroFantasticoX","TiroDeEsquinaX","GolDeCabecaX","DefensorXtremeX","DribbleMasterX","CazagolesX","BalonControladoX","TiroPrecisoX","ContraAtaqueRapidoX","RegateFinalX","RemateFuriosoX","FintaFinalX","GolazoTotalX","DefensaMagicaX","ArqueroSeguroProX","TiroVoladorX","BalonMágicoProX","CabezazoFuriosoX","ZonaAtaqueX","PaseCruzadoX","PorteroRayoX","GolFantasticoX","DribbleXtremeX","ArqueroPro123X","BalonDeOroProX","TiroEsquinaMagicoX","GolDePlacaFinalX","RecuperadorRapidoX","AsistenciaLetalX","PatadaMagicaX","MVPRealX","FutbolTotalX","GolazoXtremeX","PorteroInvencibleX","RemateFinalX","RegateMagicoX","ControlDeBalonX","PaseLetalX","DefensaProX","ArqueroLegendX","TiroCurvoLetalX","BalonRotoFinalX","GoleadorTopX","FintaLetalX","VelocidadMaximaX","ZonaMediaX","PaseMagicoProX","PorteroFantasticoProX","TiroDeEsquinaProX","GolDeCabecaProX","DefensorLegendarioX","DribbleFinalX","CazaGolesX","ArqueroMVPX","BalonControlX","TiroPrecisoProX","ContraAtaqueTotalX","RegateFinalX","RemateLetalX","FintaProX","PasePerfectX","GolazoFinalX","DefensaXtremeX","ArqueroSeguroX","TiroVoladorProX","BalonMagicoX","CabezazoX","ZonaAtaqueProX","PaseCruzadoProX","PorteroRayoProX","TiroDeGolX","GolFantasticoProX","DefensaLetalX","DribbleXtremeProX","ArqueroProX","BalonDeOroXtremeX","TiroEsquinaMagicoProX","GolDePlacaXtremeX","RecuperadorRapidoProX","AsistenciaLetalProX","PatadaMagicaProX","MVPRealProX","FutbolTotalProX","GolazoXtremeProX","PorteroInvencibleProX","RemateFinalProX","RegateMagicoProX","ControlDeBalonProX","PaseLetalProX","DefensaProProX","ArqueroLegendProX","TiroCurvoLetalProX","BalonRotoXtremeX","GoleadorMVPX","FintaXtremeProX","VelocidadFinalX","ZonaDefensaProX","PaseMagicoXtremeX","PorteroFantasticoXtremeX","GolDeCabecaFinalX","ArqueroInvencibleX","BalonMagicoFinalX","RematePerfectoX","RegateIncreibleX","TiroImparableX","DefensaLegendX","CruzadoGolX","PaseMaestroX","GolazoRealX","FintaLegendX","ArqueroTopX","DribbleFuriosoX","BalonDeOroLegendX","ContraataqueTotalX","RegateMagicoLegendX","TiroLetalX","GolazoMasterX","PateadorLegendX","PorteroRayoLegendX","ControlTotalLegendX","AsistenciaMagicaX","RemateMortalX","CabezazoLegendX","ZonaAtaqueLegendX","PasePerfectoLegendX","DefensaMagicaLegendX","ArqueroLegendarioProX","BalonDeOroFinalX","TiroEsquinaLegendX","GolDePlacaLegendX","RecuperadorLegendX","MVPdelPartidoLegendX","FutbolArteLegendX","GolazoFinalLegendX","PorteroInvencibleLegendX","RemateFinalLegendX","RegateMagicoFinalX","ControlDeBalonLegendX","PaseLetalLegendX"]
        

    env:
      HAXBALL_ROOM_URL: ${{ github.event.inputs.haxball_room_url }}
      MENSAJE: ${{ github.event.inputs.mensaje }}
      LLAMAR_ADMIN: ${{ github.event.inputs.llamar_admin }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Limpiar entorno previo
        run: rm -rf node_modules package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias limpias (incluye puppeteer completo)
        run: |
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
          npm ci

      - name: Ejecutar bot
        run: node botsstefano.js
        env:
          JOB_ID: ${{ matrix.job_id }}
        timeout-minutes: 60
